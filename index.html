  button { font-family: inherit; }
  input { font-family: inherit; }

  h1 {

  .bday {

  }

  /* ---------- plan tabs ---------- */
  .tabs { display: flex; gap: 4px; flex-wrap: wrap; }
  .tab {
    border: 1px solid var(--line); border-bottom: none;
    background: var(--surface-2); color: var(--ink-2);

    position: relative; top: 1px;
  }
  .tab:hover { color: var(--ink); }
  .tab[aria-selected="true"] {
    background: var(--surface); color: var(--ink);
    border-color: var(--line-strong);
    box-shadow: inset 0 3px 0 var(--accent);
  }
  .tab .tsub { display: block; font-size: 10px; font-weight: 400; color: var(--ink-3); letter-spacing: .06em; }

  /* ---------- layout ---------- */
  .stage { padding: 26px 0 60px; }
  .cols { display: grid; grid-template-columns: minmax(0, 1fr) 320px; gap: 22px; align-items: start; }
  @media (max-width: 900px) { .cols { grid-template-columns: 1fr; } }

  .panel {
    background: var(--surface); border: 1px solid var(--line);
    border-radius: 14px; box-shadow: var(--shadow);
  }

  /* ---------- timeline ---------- */
  .plan-intro { padding: 16px 20px; border-bottom: 1px solid var(--line); }
  .plan-intro h2 { font-family: var(--serif); font-size: 20px; margin: 0 0 4px; font-weight: 600; }
  .plan-intro p { margin: 0; font-size: 12.5px; color: var(--ink-2); }

  .day { padding: 14px 20px 10px; }
  .day + .day { border-top: 1px solid var(--line); }
  .dhead { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; margin-bottom: 4px; }
  .dhead .dd { font-family: var(--serif); font-size: 17px; font-variant-numeric: tabular-nums; }
  .dhead .dw { font-size: 11.5px; color: var(--ink-3); font-weight: 700; letter-spacing: .08em; }
  .dhead .dnote { font-size: 11px; color: var(--ink-3); margin-left: auto; }
  .dwarn {
    font-size: 11.5px; color: var(--warn); background: var(--warn-bg);
    border-radius: 8px; padding: 6px 12px; margin: 6px 0;
  }

  .slot {
    display: flex; align-items: flex-start; gap: 10px;
    padding: 9px 0;
  }
  .slot + .slot { border-top: 1px dashed var(--line); }
  .slot .sbody { flex: 1; min-width: 0; }
  .slot .sname { font-size: 13.5px; font-weight: 700; line-height: 1.5; }
  .slot .sname a { text-decoration: none; border-bottom: 1px dotted var(--line-strong); }
  .slot .sname a:hover { color: var(--accent-strong); border-color: var(--accent-strong); }
  .slot .sname a::after { content: "↗"; font-size: 10px; color: var(--accent-strong); margin-left: 3px; }
  .slot .smeta { font-size: 11px; color: var(--ink-3); }
  .slot .sprice { font-size: 12.5px; font-weight: 700; white-space: nowrap; font-variant-numeric: tabular-nums; padding-top: 1px; }
  .slot .sprice small { color: var(--ink-3); font-weight: 400; }
  .rm {
    border: 1px solid var(--line); background: transparent; color: var(--ink-3);

  .rm:hover { color: var(--ng); border-color: var(--ng); }
  .empty-day { font-size: 12px; color: var(--ink-3); padding: 8px 0; font-style: normal; }

  .bslot {
    margin: 10px 0 6px; border: 1px solid var(--accent);
    background: linear-gradient(0deg, var(--accent-soft), var(--accent-soft));
    border-radius: 12px; padding: 12px 16px;

  .bslot .btitle { font-size: 11px; font-weight: 700; letter-spacing: .16em; color: var(--accent-strong); margin-bottom: 6px; }
  .bslot select {
    width: 100%; padding: 8px 10px; border-radius: 8px;
    border: 1px solid var(--line-strong); background: var(--surface); color: var(--ink);

  }
  .bslot .bmeta { font-size: 11.5px; color: var(--ink-2); margin-top: 6px; }
  .bslot .bmeta a { color: var(--accent-strong); }

  .costbox { position: sticky; top: 14px; }
  .costbox h3 {

  .crow .cl { color: var(--ink-2); }

  .crow input {

  .reset {

  .pool { display: grid; grid-template-columns: repeat(auto-fill, minmax(255px, 1fr)); gap: 14px; }
  .card {
    background: var(--surface); border: 1px solid var(--line); border-radius: 12px;
    padding: 14px 16px 12px; box-shadow: var(--shadow);

  .card .chead { display: flex; justify-content: space-between; gap: 8px; align-items: flex-start; }
  .card .cname { font-size: 13.5px; font-weight: 700; line-height: 1.45; }
  .card .cname a { text-decoration: none; border-bottom: 1px dotted var(--line-strong); }
  .card .cname a:hover { color: var(--accent-strong); border-color: var(--accent-strong); }
  .card .cname a::after { content: "↗"; font-size: 10px; color: var(--accent-strong); margin-left: 3px; }
  .cat {
    font-size: 9.5px; font-weight: 700; letter-spacing: .1em;

  .cat.c-food { background: var(--accent-soft); color: var(--accent-strong); border-color: transparent; }
  .card .cprice { font-size: 15px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .card .cprice small { font-size: 10.5px; color: var(--ink-3); font-weight: 400; }
  .card .cnote { font-size: 11.5px; color: var(--ink-2); line-height: 1.6; flex: 1; }
  .avail { display: flex; gap: 5px; }
  .av {
    font-size: 10px; font-weight: 700; border-radius: 5px; padding: 1px 7px;

  .av.open { background: var(--ok-bg); color: var(--ok); }
  .av.closed { background: var(--ng-bg); color: var(--ng); }
  .av.check { background: var(--warn-bg); color: var(--warn); }
  .addrow { display: flex; gap: 6px; }
  .addbtn {
    flex: 1; border: 1px solid var(--line-strong); background: var(--paper); color: var(--ink-2);
    border-radius: 8px; padding: 5px 0; font-size: 11.5px; font-weight: 700; cursor: pointer;

  .addbtn:hover:not(:disabled) { border-color: var(--accent-strong); color: var(--ink); }
  .addbtn:disabled { opacity: .35; cursor: not-allowed; }
  .addbtn.on { background: var(--ink); border-color: var(--ink); color: var(--paper); }

  /* ---------- footer ---------- */
  footer.page {
    border-top: 1px solid var(--line); margin-top: 40px;
    padding: 20px 0 44px; font-size: 11.5px; color: var(--ink-3);

    .tab { padding: 8px 12px 6px; font-size: 12px; }

          days: { sat: "open", sun: "open", mon: "open" }, note: "遊泳期間は10/31まで(9:00–18:00)・ライフガード常駐。市内から自転車圏",
          source: { label: "波の上うみそら公園公式", url: "https://www.naminouebeach.jp/guidance/beach/" } },
        { id: "makishi", name: "第一牧志公設市場「持ち上げ」", category: "food", price: 2500, priceNote: "調理代550円+食材代の目安", durH: 1.5, duration: "約1.5時間",
          days: { sat: "open", sun: "open", mon: "open" }, note: "1階で買った魚介を2階食堂で調理してもらう名物システム。10/4(第1日曜)は営業",
          source: { label: "第一牧志公設市場公式", url: "https://www.makishi-public-market.jp/about/howto/" } },
        { id: "gangala", name: "ガンガラーの谷 ガイドツアー", category: "sight", price: 2500, priceNote: "前日17時までの予約推奨", durH: 1.4, duration: "約1時間20分",
          days: { sat: "open", sun: "open", mon: "open" }, note: "亜熱帯の森を歩くツアー。出発10:00/12:00/14:00/16:00 — 月曜は10時回なら可",
          source: { label: "ガンガラーの谷公式", url: "https://gangala.com/about/" } },
        { id: "okiworld", name: "おきなわワールド(玉泉洞)", category: "sight", price: 2000, priceNote: "WEB前売1,900円", durH: 2.5, duration: "約2〜3時間",
          days: { sat: "open", sun: "open", mon: "open" }, note: "年中無休9:00–17:30。ガンガラーの谷の向かいでセットで回れる",
          source: { label: "おきなわワールド公式", url: "https://www.gyokusendo.co.jp/okinawaworld/fee/" } }
      ],
      dinners: [
        { name: "モビーディック号 サンセットディナークルーズ", price: 7000, note: "乗船+ディナー込み(WEB割6,700円)。10月は17:15出航〜18:45帰港・ライブ演奏付き。不定期運休あり — 10/4(日)の運航要確認。",
          source: { label: "リウボウ旅行サービス", url: "https://rts21.co.jp/tour_options/view/dinnercruise-1st" } },
        { name: "鉄板焼 まつ尾(那覇国際通り)", price: 15000, note: "目安。もとぶ牛・県産和牛の鉄板焼。記念日プレート対応のアニバーサリープランあり、日曜夜も営業。",
          source: { label: "一休.comレストラン", url: "https://restaurant.ikyu.com/area/okinawa/001/0203/05/t-scene369/" } },
        { name: "琉球料理と琉球舞踊 四つ竹 久米店", price: 8000, note: "目安。琉球舞踊を鑑賞しながら琉球会席。沖縄らしい記念日向けの一軒。",
          source: { label: "記念日レストラン特集", url: "https://oiwai.anny.gift/celebrations/birthday-naha-okinawa" } }
      ],
      defaults: { sat: ["shurijo", "zuisen", "makishi"], sun: ["kerama", "ryusen"], mon: ["churachari"], dinner: 0 },
      lodging: {
        label: "ハイアットリージェンシー那覇(2人2泊4.5〜7万円)。手頃なシティホテルなら2〜3.6万円",
        range: "", price: 55000,
        source: { label: "じゃらん ハイアット那覇", url: "https://www.jalan.net/yad373185/plan/" }
      },
      transport: [
        { label: "東京⇔那覇 往復", price: 35000, note: "ANA/JAL早割3〜4.5万円、LCCなら2〜2.5万円" },
        { label: "ゆいレール等 市内移動", price: 1000, note: "24時間フリー乗車券1,000円" }
      ]
    }
  ]
};

(function () {
  "use strict";

  var DAYS = [
    { key: "sat", d: 3, dow: "土", label: "Day 1", note: "終日" },
    { key: "sun", d: 4, dow: "日", label: "Day 2", note: "終日 + 夜は誕生日前夜ディナー" },
    { key: "mon", d: 5, dow: "月", label: "Day 3 誕生日", note: "昼過ぎ帰路 — 午前のみ" }
  ];
  var MON_LIMIT_H = 3.5;
  var CATS = {
    all: "すべて",
    cycling: "サイクリング",
    marine: "マリン",
    art: "アート",
    craft: "ものづくり",
    sight: "観光",
    onsen: "温泉",
    food: "食"
  };
  var STATUS_TXT = { open: "OK", closed: "休", check: "要確認" };
  var LS_KEY = "tripstudio-v1";

  /* ---------- state ---------- */
  function defaultState() {
    var s = { tab: DATA.plans[0].id, plans: {} };
    DATA.plans.forEach(function (p) {
      s.plans[p.id] = {
        days: { sat: p.defaults.sat.slice(), sun: p.defaults.sun.slice(), mon: p.defaults.mon.slice() },
        dinner: p.defaults.dinner,
        lodging: p.lodging.price,
        transport: p.transport.map(function (t) { return t.price; })
      };
    });
    return s;
  }

  var state = defaultState();
  try {
    var saved = JSON.parse(localStorage.getItem(LS_KEY) || "null");
    if (saved && saved.plans) {
      if (saved.tab && DATA.plans.some(function (p) { return p.id === saved.tab; })) state.tab = saved.tab;
      DATA.plans.forEach(function (p) {
        var sp = saved.plans[p.id];
        if (!sp) return;
        var cur = state.plans[p.id];
        ["sat", "sun", "mon"].forEach(function (k) {
          if (Array.isArray(sp.days && sp.days[k])) {
            cur.days[k] = sp.days[k].filter(function (id) { return actById(p, id); });
          }
        });
        if (typeof sp.dinner === "number" && p.dinners[sp.dinner]) cur.dinner = sp.dinner;
        if (typeof sp.lodging === "number") cur.lodging = sp.lodging;
        if (Array.isArray(sp.transport)) {
          sp.transport.forEach(function (v, i) { if (typeof v === "number" && i < cur.transport.length) cur.transport[i] = v; });
        }
      });
    }
  } catch (e) { /* corrupt storage -> defaults */ }

  function save() {
    try { localStorage.setItem(LS_KEY, JSON.stringify(state)); } catch (e) { /* private mode */ }
  }

  function plan() { return DATA.plans.filter(function (p) { return p.id === state.tab; })[0]; }
  function pstate() { return state.plans[state.tab]; }
  function actById(p, id) {
    return p.activities.filter(function (a) { return a.id === id; })[0] || null;
  }

  var catFilter = "all";

  /* ---------- helpers ---------- */
  function esc(s) {
    return String(s).replace(/[&<>"]/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c];
    });
  }
  function yen(n) { return "¥" + Math.round(n).toLocaleString("ja-JP"); }
  function srcLink(src, cls) {
    return '<a class="' + (cls || "") + '" href="' + esc(src.url) + '" target="_blank" rel="noopener" title="出典: ' + esc(src.label) + '">';
  }

  /* ---------- cost ---------- */
  function costs() {
    var p = plan(), s = pstate();
    var act = 0;
    ["sat", "sun", "mon"].forEach(function (k) {
      s.days[k].forEach(function (id) {
        var a = actById(p, id);
        if (a) act += a.price;
      });
    });
    var dinner = s.dinner != null && p.dinners[s.dinner] ? p.dinners[s.dinner].price : 0;
    var transport = s.transport.reduce(function (x, y) { return x + y; }, 0);
    var perPerson = transport + act + dinner + s.lodging / 2;
    return { act: act, dinner: dinner, transport: transport, lodging: s.lodging, perPerson: perPerson, couple: perPerson * 2 };
  }

  /* ---------- renderers ---------- */
  function renderTabs() {
    var el = document.getElementById("tabs");
    el.innerHTML = DATA.plans.map(function (p) {
      return '<button class="tab" role="tab" data-plan="' + p.id + '" aria-selected="' + (p.id === state.tab) + '">' +
        esc(p.name) + '<span class="tsub">' + esc(p.sub) + "</span></button>";
    }).join("");
    Array.prototype.forEach.call(el.querySelectorAll(".tab"), function (btn) {
      btn.addEventListener("click", function () {
        state.tab = btn.getAttribute("data-plan");
        save();
        renderAll();
      });
    });
  }

  function slotHtml(p, id, dayKey) {
    var a = actById(p, id);
    if (!a) return "";
    var st = a.days[dayKey];
    var warn = st === "check" ? ' <span class="av check">要確認</span>' : "";
    return '<div class="slot">' +
      '<div class="sbody"><div class="sname">' + srcLink(a.source) + esc(a.name) + "</a>" + warn + "</div>" +
      '<div class="smeta">' + esc(a.duration) + (a.note ? " · " + esc(a.note) : "") + "</div></div>" +
      '<div class="sprice">' + (a.price === 0 ? "無料" : yen(a.price) + "<small>/人</small>") + "</div>" +
      '<button class="rm" data-rm="' + a.id + '" data-day="' + dayKey + '" aria-label="' + esc(a.name) + 'をDay ' + dayKey + 'から外す">×</button>' +
      "</div>";
  }

  function renderTimeline() {
    var p = plan(), s = pstate();
    var html = '<div class="plan-intro"><h2>' + esc(p.name) + "</h2><p>" + esc(p.intro) + "</p></div>";

    DAYS.forEach(function (day) {
      var ids = s.days[day.key];
      html += '<div class="day"><div class="dhead"><span class="dd">10.' + day.d + "</span>" +
        '<span class="dw">' + day.dow + "曜 · " + day.label + "</span>" +
        '<span class="dnote">' + day.note + "</span></div>";

      if (day.key === "mon") {
        var h = ids.reduce(function (sum, id) {
          var a = actById(p, id);
          return sum + (a ? a.durH : 0);
        }, 0);
        if (h > MON_LIMIT_H) {
          html += '<div class="dwarn">Day 3は昼過ぎ出発 — 選択中の所要 約' + h.toFixed(1).replace(/\.0$/, "") + "時間は詰め込みすぎかも。午前で回れる約" + MON_LIMIT_H + "時間以内が目安。</div>";
        }
      }

      html += ids.length
        ? ids.map(function (id) { return slotHtml(p, id, day.key); }).join("")
        : '<div class="empty-day">まだ何も入っていません — 下の候補プールから「+10/' + day.d + '」で追加。</div>';

      if (day.key === "sun") {
        var d = s.dinner != null ? p.dinners[s.dinner] : null;
        html += '<div class="bslot"><div class="btitle">DAY 2 NIGHT — 誕生日前夜ディナー(日付が変わる瞬間にお祝い)</div>' +
          '<select id="dinnerSel" aria-label="誕生日ディナーを選択">' +
          '<option value=""' + (s.dinner == null ? " selected" : "") + ">ディナーを選ぶ…</option>" +
          p.dinners.map(function (dn, i) {
            return '<option value="' + i + '"' + (s.dinner === i ? " selected" : "") + ">" + esc(dn.name) + "(" + yen(dn.price) + "/人)</option>";
          }).join("") +
          "</select>" +
          (d ? '<div class="bmeta">' + esc(d.note) + " " + srcLink(d.source) + esc(d.source.label) + " ↗</a></div>" : "") +
          "</div>";
      }
      html += "</div>";
    });

    var el = document.getElementById("timeline");
    el.innerHTML = html;

    Array.prototype.forEach.call(el.querySelectorAll(".rm"), function (btn) {
      btn.addEventListener("click", function () {
        var id = btn.getAttribute("data-rm"), day = btn.getAttribute("data-day");
        var arr = pstate().days[day];
        var i = arr.indexOf(id);
        if (i >= 0) arr.splice(i, 1);
        save();
        renderTimeline(); renderCost(); renderPool();
      });
    });
    var sel = el.querySelector("#dinnerSel");
    if (sel) sel.addEventListener("change", function () {
      pstate().dinner = sel.value === "" ? null : Number(sel.value);
      save();
      renderTimeline(); renderCost();
    });
  }

  function renderCost() {
    var p = plan(), s = pstate(), c = costs();
    var el = document.getElementById("costbox");
    var html = "<h3>費用の試算</h3>" + '<div class="cost-rows">';

    p.transport.forEach(function (t, i) {
      html += '<div class="crow"><span class="cl">' + esc(t.label) + ' <small>/人</small></span>' +
        '<input type="number" min="0" step="100" value="' + s.transport[i] + '" data-tr="' + i + '" aria-label="' + esc(t.label) + 'の金額"></div>';
    });
    html += '<div class="crow"><span class="cl">宿泊(2人2泊)</span>' +
      '<input type="number" min="0" step="1000" value="' + s.lodging + '" data-lodging aria-label="宿泊費"></div>';
    html += '<div class="crow sub"><span class="cl">アクティビティ計 /人</span><span class="cv">' + yen(c.act) + "</span></div>";
    html += '<div class="crow"><span class="cl">誕生日ディナー /人</span><span class="cv">' + (c.dinner ? yen(c.dinner) : "—") + "</span></div>";
    html += "</div>";
    html += '<button class="reset" id="resetBtn">このプランを初期状態に戻す</button>';
    html += '<div class="ctotal"><div class="tl">2人合計(概算)</div>' +
      '<div class="tv">' + yen(c.couple) + "<small> /2人</small></div>" +
      '<div class="tp">1人あたり ' + yen(c.perPerson) + "</div></div>";
    html += '<p class="cost-note">交通・宿泊は調査時点の概算(編集可)。宿の目安: ' + esc(p.lodging.label) + " " + esc(p.lodging.range) + " " + srcLink(p.lodging.source) + esc(p.lodging.source.label) + " ↗</a></p>";
    el.innerHTML = html;

    Array.prototype.forEach.call(el.querySelectorAll("input[data-tr]"), function (inp) {
      inp.addEventListener("input", function () {
        pstate().transport[Number(inp.getAttribute("data-tr"))] = Number(inp.value) || 0;
        save();
        updateTotals();
      });
    });
    var lg = el.querySelector("input[data-lodging]");
    lg.addEventListener("input", function () {
      pstate().lodging = Number(lg.value) || 0;
      save();
      updateTotals();
    });
    el.querySelector("#resetBtn").addEventListener("click", function () {
      var p2 = plan();
      state.plans[p2.id] = {
        days: { sat: p2.defaults.sat.slice(), sun: p2.defaults.sun.slice(), mon: p2.defaults.mon.slice() },
        dinner: p2.defaults.dinner,
        lodging: p2.lodging.price,
        transport: p2.transport.map(function (t) { return t.price; })
      };
      save();
      renderAll();
    });
  }

  function updateTotals() {
    var c = costs();
    var el = document.getElementById("costbox");
    el.querySelector(".tv").innerHTML = yen(c.couple) + "<small> /2人</small>";
    el.querySelector(".tp").textContent = "1人あたり " + yen(c.perPerson);
  }

  function renderCatFilters() {
    var el = document.getElementById("catFilters");
    el.innerHTML = Object.keys(CATS).map(function (k) {
      return '<button class="fbtn" data-cat="' + k + '" aria-pressed="' + (catFilter === k) + '">' + CATS[k] + "</button>";
    }).join("");
    Array.prototype.forEach.call(el.querySelectorAll(".fbtn"), function (btn) {
      btn.addEventListener("click", function () {
        catFilter = btn.getAttribute("data-cat");
        renderCatFilters();
        renderPool();
      });
    });
  }

  function renderPool() {
    var p = plan(), s = pstate();
    var el = document.getElementById("pool");
    el.innerHTML = p.activities.filter(function (a) {
      return catFilter === "all" || a.category === catFilter;
    }).map(function (a) {
      var inAny = ["sat", "sun", "mon"].some(function (k) { return s.days[k].indexOf(a.id) >= 0; });
      var btns = DAYS.map(function (day) {
        var st = a.days[day.key];
        var on = s.days[day.key].indexOf(a.id) >= 0;
        var dis = st === "closed" ? " disabled" : "";
        return '<button class="addbtn' + (on ? " on" : "") + '" data-add="' + a.id + '" data-day="' + day.key + '"' + dis +
          ' aria-pressed="' + on + '" aria-label="' + esc(a.name) + "を10/" + day.d + "に" + (on ? "から外す" : "追加") + '">' +
          (on ? "✓ " : "+ ") + "10/" + day.d + "</button>";
      }).join("");
      var avail = DAYS.map(function (day) {
        var st = a.days[day.key];
        return '<span class="av ' + st + '">' + day.d + "日 " + STATUS_TXT[st] + "</span>";
      }).join("");
      return '<article class="card' + (inAny ? " in" : "") + '">' +
        '<div class="chead"><div class="cname">' + srcLink(a.source) + esc(a.name) + "</a></div>" +
        '<span class="cat c-' + a.category + '">' + CATS[a.category] + "</span></div>" +
        '<div class="cprice">' + (a.price === 0 ? "無料" : yen(a.price) + "<small> /人</small>") +
        (a.priceNote ? ' <small>' + esc(a.priceNote) + "</small>" : "") + "</div>" +
        '<div class="cnote">' + esc(a.duration) + " · " + esc(a.note) + "</div>" +
        '<div class="avail">' + avail + "</div>" +
        '<div class="addrow">' + btns + "</div>" +
        "</article>";
    }).join("");

    Array.prototype.forEach.call(el.querySelectorAll(".addbtn"), function (btn) {
      btn.addEventListener("click", function () {
        var id = btn.getAttribute("data-add"), day = btn.getAttribute("data-day");
        var arr = pstate().days[day];
        var i = arr.indexOf(id);
        if (i >= 0) arr.splice(i, 1); else arr.push(id);
        save();
        renderTimeline(); renderCost(); renderPool();
      });
    });
  }

  function renderFoot() {
    document.getElementById("footNote").innerHTML =
      "料金・営業情報は2026年7月時点の調査(各カードの公式リンク参照)。「要確認」は予約時に公式へ確認を。曜日判定の根拠: " +
      '<a href="https://www8.cao.go.jp/chosei/shukujitsu/gaiyou.html" target="_blank" rel="noopener">内閣府 国民の祝日</a>(10/5は祝日でない月曜) · ' +
      '直島の月曜休館は <a href="https://benesse-artsite.jp/calendar/" target="_blank" rel="noopener">ベネッセアートサイト直島 開館カレンダー</a>。' +
      "選択内容はこのブラウザに自動保存されます。";
  }

  function renderAll() {
    renderTabs();
    renderTimeline();
    renderCost();
    renderCatFilters();
    renderPool();
  }

  renderAll();
  renderFoot();
})();

</script>
